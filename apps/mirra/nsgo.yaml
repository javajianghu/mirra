# The name the app shows and its packages carry (Mirra.app, mirra-<version>-<target> in releases). The Release workflow bumps the version (.github/scripts/set-version.sh).
name: Mirra
id: ai.yldm.mirra
version: 0.20.1
# The app always shows its dark theme; the web page takes the same color while the app loads.
appearance: dark

# Every target uses assets/Icon.png, drawn by tools/appicon.
icon:
  png: assets/Icon.png

dev:
  # native: this machine's backend; web: the browser; ios: a connected iPhone; ios_simulator; android: a connected device or emulator.
  target: native
  # true, the default, rebuilds and restarts on save; false runs once and exits with the app.
  hot_reload: true

build:
  output: dist
  # true opens the output directory after building.
  open: false
  # The web build keeps the key, works and clothes only as long as the page: a browser has no secure store or file system for them.
  targets: [macos_arm64, windows_x64, ios_simulator, android_arm64, web]

# The GitHub repository whose releases the install scripts install from.
release: { github: yldm-ai/mirra }

# The app updates itself from the latest release: Sparkle on macOS and WinSparkle on Windows check daily, Android as it starts, each reading appcast-<target>.xml, which a release build signs with the secret key in NSGO_UPDATES_KEY (the Package workflow). key is its public half, as nsgo keygen printed it; a copy keeps only updates signed with it.
updates:
  key: wsnufR2hksnmx3vHSwehpAXMKLlrZTbzMSsQAenB7Ys=
